merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: vm1-crossqueue-a
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = vm1-crossqueue-base2-260923
      - title = VM1_CQ_A_260923
    merge_conditions:
      - check-success = queue-hold

  - name: vm1-crossqueue-b
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = vm1-crossqueue-base2-260923
      - title = VM1_CQ_B_260923
    merge_conditions:
      - check-success = vm1-cq-never-b

  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 10 min
    queue_conditions:
      - base != vm1-crossqueue-base2-260923
    merge_conditions: []

  - name: vm1-pkgopt-261009
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
    queue_conditions:
      - base = vm1-pkgopt-target-261009
      - title ~= ^VM1_PKGOPT_(A|B)_261009$
    merge_conditions:
      - check-success = vm1-pkgopt-release-261009

  - name: vm1-yarncond-261010
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 5 minutes
    queue_conditions:
      - base = vm1-yarncond-base-261010
      - title ~= ^VM1_YARNCOND_[AB]_261010$
    autoqueue: true
    merge_conditions:
      - check-success = vm1-yarncond-never-261010

pull_request_rules:
  - name: VM1_CODEOWNERS_OWNER_CASE_IMPACT
    conditions:
      - base = main
      - title = VM1_CODEOWNERS_OWNER_CASE_IMPACT
      - label = vm1-codeowners-owner-case-trigger
    actions:
      queue:
        name: default

  - name: VM1_QCHECK_TRUSTED_APP_IDENTITY
    conditions:
      - base = main
      - title = VM1_QCHECK_A_POSITIVE_260923
      - check-success = @vm1-qc-trusted/vm1-qualified-gate
    actions:
      label:
        add:
          - vm1-qcheck-passed

  - name: VM1_QUALIFIED_CHECK_APP_IDENTITY
    conditions:
      - base = main
      - title = VM1_QUALIFIED_CHECK_APP_IDENTITY
      - check-success = @vm1-qcheck-a-260923/vm1-qualified-gate
    actions:
      label:
        add:
          - vm1-qcheck-qualified-match

  - name: VM1_REVIEWREQ_REMOVE_260927
    conditions:
      - base = vm1-reviewreq-remove-base-260927
      - title ~= ^VM1_REVIEWREQ_REMOVE_
      - author = livastic-vm1-secondary
    actions:
      post_check:
        title: VM1 review-request removal freshness 260927
        summary: Controlled review-request removal freshness discriminator
        success_conditions:
          - review-requested = livastic-vm1-primary

  - name: VM1_BUILDKITE_SCOPE_IMPACT_261004
    conditions:
      - "number = 378"
      - "base = vm1-reviewreq-remove-base-260927"
      - "author = livastic-vm1-secondary"
      - "-scope = protected/vm1-jenkins-scope-h3-261004.txt"
    actions:
      queue:
        name: default

  - name: VM1_FORK_REPO_COLLISION_DIRECT_MERGE_261008
    conditions:
      - base = vm1-headsdwim-read-base-261008
      - title ~= ^VM1_HEADSDWIM_READ_(CONTROL|TREATMENT)_261008$
      - author = livastic-vm1-secondary
      - check-success = @github-actions/vm1-headsdwim-read-gate
    actions:
      merge:
        method: merge
  - name: VM1_PKGOPT_AUTOQUEUE_261009
    conditions:
      - base = vm1-pkgopt-target-261009
      - title ~= ^VM1_PKGOPT_(A|B)_261009$
    actions:
      queue:
        name: vm1-pkgopt-261009

conflict_resolvers:
  - package-manager: npm
    directories:
      - /pkg
  - paths:
      - yarncond/yarn.lock
    strategy: yarn

merge_protections_settings:
  post_comment: false

merge_protections:
  - name: VM1_COMMIT_PAGINATION_ENFORCE_ADMINS_AB_260925
    if:
      - base = vm1-pagination-enforce-admins-base-260925
    success_conditions:
      - "#commits-unverified = 0"

