merge_queue:
  queue_controls_comment: false
queue_rules:
  - name: vm1 overlapping freeze aggregation
    batch_size: 1
    batch_max_wait_time: 1 sec
    max_checks_retries: 1
    queue_conditions:
      - title = VM1_FREEZE_OVERLAP_AGGREGATION
    merge_conditions:
      - check-success = vm1-never-freeze-overlap-merge
