pull_request_rules:
  - name: VM1_RULESET_MIDFLIGHT_CREATE
    conditions:
      - base = vm1-ruleset-midflight-base-260914
      - title = VM1_RULESET_MIDFLIGHT_CREATE
    actions:
      queue:
        name: default

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = queue-hold
