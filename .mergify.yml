queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions: []

  - name: vm1-draftbot-stale
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 1 sec
    max_checks_retries: 1
    draft_bot_account: livastic-vm1-secondary
    allow_queue_branch_edit: false
    queue_conditions:
      - base = vm1-draftbot-base-260915
      - title = VM1_DRAFT_BOT_STALE_260915
    merge_conditions:
      - check-success = vm1-draftbot-gate

pull_request_rules:
  - name: VM1_CODEOWNERS_OWNER_CASE_IMPACT
    conditions:
      - base = main
      - title = VM1_CODEOWNERS_OWNER_CASE_IMPACT
      - label = vm1-codeowners-owner-case-trigger
    actions:
      queue:
        name: default

  - name: VM1 draft-bot stale credential queue
    conditions:
      - base = vm1-draftbot-base-260915
      - title = VM1_DRAFT_BOT_STALE_260915
    actions:
      queue:
        name: vm1-draftbot-stale
