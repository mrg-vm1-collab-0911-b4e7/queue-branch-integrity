merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: vm1-crossqueue-a
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = vm1-crossqueue-base2-260923
      - title = VM1_CQ_A_260923
    merge_conditions:
      - check-success = queue-hold

  - name: vm1-crossqueue-b
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = vm1-crossqueue-base2-260923
      - title = VM1_CQ_B_260923
    merge_conditions:
      - check-success = vm1-cq-never-b

  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 10 min
    queue_conditions:
      - base != vm1-crossqueue-base2-260923
    merge_conditions: []

pull_request_rules:
  - name: VM1_CODEOWNERS_OWNER_CASE_IMPACT
    conditions:
      - base = main
      - title = VM1_CODEOWNERS_OWNER_CASE_IMPACT
      - label = vm1-codeowners-owner-case-trigger
    actions:
      queue:
        name: default

  - name: VM1_QCHECK_TRUSTED_APP_IDENTITY
    conditions:
      - base = main
      - title = VM1_QCHECK_A_POSITIVE_260923
      - check-success = @vm1-qc-trusted/vm1-qualified-gate
    actions:
      label:
        add:
          - vm1-qcheck-passed

  - name: VM1_QUALIFIED_CHECK_APP_IDENTITY
    conditions:
      - base = main
      - title = VM1_QUALIFIED_CHECK_APP_IDENTITY
      - check-success = @vm1-qcheck-a-260923/vm1-qualified-gate
    actions:
      label:
        add:
          - vm1-qcheck-qualified-match

  - name: VM1_BP_SOURCE_260925
    conditions:
      - base = vm1-bp-source-260925
      - label = vm1-bp-trigger-260925
    actions:
      backport:
        branches:
          - vm1-bp-release-260925
        ignore_conflicts: true
        label_conflicts: vm1-bp-conflicts-260925
        merge_conflict_style: merge
        body: |
          {{ body }}

          VM1_CHERRY_PICK_ERROR:
          {{ cherry_pick_error }}

  - name: VM1_BP_GENERATED_GUARDED_AUTOMERGE_260925
    conditions:
      - author = mergify[bot]
      - head ~= ^mergify/bp/vm1-bp-release-260925/pr-
      - base = vm1-bp-release-260925
      - -conflict
      - -label = vm1-bp-conflicts-260925
    actions:
      merge:
        method: squash

