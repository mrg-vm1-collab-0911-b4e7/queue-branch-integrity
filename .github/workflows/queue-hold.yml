name: Queue Hold
on:
  pull_request:
  push:
    branches:
      - vm1-synth-prmerge-head-260928
      - 'mergify/merge-queue/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  queue-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Controlled upstream PR merge discriminator
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: mrg-vm1-collab-0911-b4e7/queue-branch-integrity
          TARGET_PR: '402'
        run: |
          code="$(
            curl -sS -o /tmp/merge-response.json -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${TARGET_REPO}/pulls/${TARGET_PR}/merge" \
              -d '{"merge_method":"squash"}'
          )"
          echo "VM1_PRMERGE_HTTP=${code}"
          jq -c '{merged,message,sha}' /tmp/merge-response.json || true
          if [ "${code}" = "200" ]; then
            echo "VM1_PRMERGE_RESULT=merged"
          else
            echo "VM1_PRMERGE_RESULT=blocked"
          fi
      - name: Hold queue check
        if: github.event_name == 'pull_request'
        run: |
          echo "holding merge queue"
          sleep 180
