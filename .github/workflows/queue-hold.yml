name: Queue Hold

on:
  pull_request:
  push:
    branches:
      - vm1-synth-tokenwrite-head-260928
      - 'mergify/merge-queue/**'

permissions:
  contents: write

jobs:
  queue-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Controlled upstream ref write discriminator
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: mrg-vm1-collab-0911-b4e7/queue-branch-integrity
          PROOF_REF: refs/heads/vm1-synth-tokenwrite-proof-260928
          PROOF_SHA: 3bcf20e75daeeab85a014901e5342d5e1615ecd1
        run: |
          code="$(
            curl -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${TARGET_REPO}/git/refs" \
              -d "{\"ref\":\"${PROOF_REF}\",\"sha\":\"${PROOF_SHA}\"}"
          )"
          echo "VM1_TOKENWRITE_HTTP=${code}"
          if [ "${code}" = "201" ]; then
            echo "VM1_TOKENWRITE_RESULT=write"
          else
            echo "VM1_TOKENWRITE_RESULT=blocked"
          fi
      - name: Hold queue check
        if: github.event_name == 'pull_request'
        run: |
          echo "holding merge queue"
          sleep 180
