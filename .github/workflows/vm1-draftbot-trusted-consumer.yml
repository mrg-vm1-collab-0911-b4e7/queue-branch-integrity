name: VM1 DraftBot Trusted Consumer
'on':
  pull_request_target:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  trusted-bot-consumer:
    if: github.event.pull_request.user.id == 327861250 && startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Record trusted-bot canary without exposing the secret
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY: ${{ secrets.VM1_DRAFTBOT_SECRET }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +x
          if [ -n "$CANARY" ]; then present=true; else present=false; fi
          gh issue create --repo "$REPO" --title "VM1_DRAFTBOT_TRUSTED_${PR}" --body "secret_present=${present}; draft_pr=${PR}; trusted_actor_id=327861250"
