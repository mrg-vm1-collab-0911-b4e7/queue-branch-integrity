name: VM1 DraftBot Retry Gate
'on':
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gate:
    name: vm1-draftbot-gate
    runs-on: ubuntu-latest
    steps:
      - name: Fail only Mergify queue drafts after delay
        shell: bash
        run: |
          if [[ "${{ github.head_ref }}" == mergify/merge-queue/* ]]; then
            echo "VM1_DRAFTBOT_QUEUE_DRAFT gate=failure-after-delay"
            sleep 180
            exit 1
          fi
          echo "VM1_DRAFTBOT_ORIGINAL_PR gate=success"
